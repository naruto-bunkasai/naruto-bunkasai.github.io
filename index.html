<style>
  :root {
    --red: #E23B4E;
    --pink: #F27D97;
    --pale: #FBD9E1;
    --green: #5E9B4F;
    --cream: #FFF4DF;
    --ink: #3a2a2e;
    --muted: #7a6468;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--cream);
    color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    font-weight: 500;
    line-height: 1.8;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }
  /* 上下のガーランド（文化祭らしさ） */
  .garland {
    width: 100%;
    height: 34px;
    background:
      conic-gradient(from 135deg at 50% 0, var(--red) 90deg, transparent 0) 0 0 / 48px 34px repeat-x;
    -webkit-mask: linear-gradient(#000 0 0);
    position: relative;
  }
  .garland::after {
    content: "";
    position: absolute;
    inset: 0;
    background: conic-gradient(from 135deg at 50% 0, var(--pink) 90deg, transparent 0) 24px 0 / 48px 34px repeat-x;
    opacity: .9;
    clip-path: inset(0 0 0 0);
  }
  main {
    width: 100%;
    max-width: 640px;
    padding: 40px 20px 56px;
    text-align: center;
    flex: 1;
  }
  .badge {
    display: inline-block;
    padding: 4px 18px;
    border-radius: 999px;
    background: var(--red);
    color: #fff;
    font-weight: 700;
    letter-spacing: .12em;
    font-size: 15px;
  }
  h1 {
    margin: 22px 0 6px;
    font-weight: 900;
    line-height: 1.25;
    color: var(--red);
    font-size: clamp(34px, 9vw, 56px);
    letter-spacing: .02em;
  }
  h1 .sub {
    display: block;
    margin-top: 6px;
    font-size: clamp(20px, 5.4vw, 30px);
    color: var(--pink);
    letter-spacing: .06em;
  }
  .catch {
    margin: 14px 0 0;
    font-weight: 700;
    font-size: clamp(16px, 4.4vw, 20px);
  }
  .berry {
    width: 120px;
    height: 120px;
    margin: 30px auto 6px;
    display: block;
    animation: bob 3.2s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-4deg); } }
  @media (prefers-reduced-motion: reduce) { .berry { animation: none; } }
  .soon {
    margin: 4px 0 26px;
    font-size: clamp(30px, 8.6vw, 46px);
    font-weight: 900;
    letter-spacing: .14em;
    color: var(--green);
  }
  .soon-note {
    margin: -18px 0 32px;
    color: var(--muted);
    font-size: 15px;
  }
  .card {
    background: #fff;
    border: 3px solid var(--pale);
    border-radius: 22px;
    padding: 22px 22px 18px;
    text-align: left;
  }
  dl { margin: 0; }
  .row {
    display: grid;
    grid-template-columns: 4.5em 1fr;
    gap: 4px 14px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--pale);
  }
  .row:last-child { border-bottom: 0; }
  dt { font-weight: 700; color: var(--red); }
  dd { margin: 0; }
  dd small { color: var(--muted); font-size: 13.5px; }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 22px 0 0;
    padding: 0;
    list-style: none;
  }
  .tags li {
    background: var(--pale);
    color: var(--red);
    border-radius: 999px;
    padding: 2px 14px;
    font-weight: 700;
    font-size: 14px;
  }
  .ig {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 32px;
    padding: 14px 26px;
    border-radius: 999px;
    background: var(--red);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    box-shadow: 0 4px 0 #b52a3b;
    transition: transform .1s, box-shadow .1s;
  }
  .ig:active { transform: translateY(3px); box-shadow: 0 1px 0 #b52a3b; }
  .ig svg { width: 22px; height: 22px; }
  .ig-note { margin: 12px 0 0; color: var(--muted); font-size: 14px; }
  footer {
    width: 100%;
    padding: 18px 20px 26px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
